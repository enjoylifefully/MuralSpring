<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Mural</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<main class="page">
		<section class="hero">
			<h1>mensagens</h1>
			<ul class="nav-links">
				<li><a th:href="@{/}">home</a></li>
				<li><a th:href="@{/postar}">postar uma nova mensagem</a></li>
				<li><a th:href="@{/mensagens}">atualizar página</a></li>
			</ul>
		</section>

		<section class="panel">
			<div th:if="${success}" th:text="${success}" class="success-message"></div>

			<div th:if="${#lists.isEmpty(messages)}" class="empty-state">
				<p>sem mensagens.</p>
			</div>

			<div th:unless="${#lists.isEmpty(messages)}" class="message-list">
				<div th:each="msg : ${messages}" class="message-card">
					<div class="message-meta">
						<strong>de:</strong> <span th:text="${msg.from()}"></span>
						<strong>para:</strong> <span th:text="${msg.to()}"></span>
						<strong>(em</strong> <span th:text="${msg.timestamp()}"></span><strong>)</strong>
					</div>
					<div th:text="${msg.message()}"></div>
				</div>
			</div>
		</section>
	</main>
</body>
</html>
